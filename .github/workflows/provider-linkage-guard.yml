name: Provider direct-linkage guard

# Reusable-workflow caller — see the header comment in
# nousergon/nousergon-lib's own provider-linkage-guard.yml for the full
# rationale. Wired here as part of alpha-engine-config-I9310 (roster
# rollout) after the 2026-08-29 krepis-router migration (telos-PR101,
# alpha-engine-config-I9305) removed telos's last direct-Anthropic
# linkage — telos carries no `.provider-linkage-allowlist.yaml` because
# it has nothing to allowlist; a future regression fails this check from
# day one instead of going undetected the way the original violation did.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caller-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    uses: nousergon/nousergon-lib/.github/workflows/provider-linkage-guard.yml@8a7fd406b42bf68599b6eae29400aeab60406ee3
