# Standard fleet Dependabot config (weekly, grouped minor+patch) — alpha-engine-config-I2525
# Majors are surfaced as ONE grouped PR per ecosystem, throttled by a 30-day
# major-version cooldown — alpha-engine-config-I2734. NOTE: Dependabot requires a
# unique (package-ecosystem, directory, target-branch) per update config, so the
# I2734 intent CANNOT be a second per-ecosystem block on its own monthly schedule
# (that shape is invalid and disables ALL updates for the repo). The `majors`
# group + `cooldown.semver-major-days: 30` below is the closest legal expression.
#
# This file previously carried exactly that invalid duplicate-block shape — two
# blocks each for (pip, /), (npm, /web) and (github-actions, /). The symptom was
# not an error but SILENT non-enforcement: all ignore/groups/cooldown directives
# were no-ops. Corrected to the fleet shape 2026-07-29 during fleet sweep
# (metron-ops-I244).
#
# `cooldown` is set for pip and npm only. Dependabot rejects
# cooldown.semver-major-days for the github-actions ecosystem (validated live
# 2026-07-16, alpha-engine-config).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
    cooldown:
      semver-major-days: 30

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # React core must stay in lockstep — Dependabot has split these before
      # (telos-ops#30), producing unmergeable halves. Patterns match before
      # the catch-all majors group (first match wins in Dependabot).
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
      # ESLint + plugins must upgrade together — ESLint 10 changed the
      # rule-context API; plugins that predate it fail at load time.
      # `eslint-config-*` is in the patterns because this project has NO
      # direct eslint plugins: the plugins arrive transitively under
      # eslint-config-next, so that package is the only sibling there is
      # to move in lockstep.
      eslint-core:
        patterns:
          - "eslint"
          - "eslint-config-*"
          - "eslint-plugin-*"
          - "@types/eslint*"
        update-types:
          - major
      majors:
        update-types:
          - major
    ignore:
      # ESLint 10 is held back, deliberately. eslint-config-next@16.3.0
      # (latest) depends on eslint-plugin-react ^7.37.0, and 7.37.5
      # (latest) still calls the `context.getFilename()` API that ESLint
      # 10 REMOVED — so every `eslint .` run dies at rule-load time with
      # "Error while loading rule 'react/display-name'", not on a lint
      # finding. That is what turned telos main red on 2026-08-02 (#78)
      # and blocked every web PR since.
      #
      # The eslint-core group above cannot prevent this on its own: the
      # incompatible package is TRANSITIVE, so there is no version of
      # eslint-config-next for Dependabot to raise alongside eslint that
      # would make the pair compatible. Grouping only helps once upstream
      # ships the fix; until then the major has to be refused outright.
      #
      # Remove this ignore (and the `~9.39.5` pin in web/package.json)
      # when eslint-plugin-react ships ESLint 10 support — tracked in
      # telos-ops#34, which names the check to re-run.
      - dependency-name: "eslint"
        versions: ["10.x"]
    cooldown:
      semver-major-days: 30

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
