# Standard fleet Dependabot config (weekly, grouped minor+patch) — alpha-engine-config-I2525
# Majors are grouped into a single monthly PR per ecosystem — alpha-engine-config-I2734
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      majors:
        update-types:
          - major
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    groups:
      # React core must stay in lockstep — Dependabot has split these before
      # (telos-ops#30), producing unmergeable halves. Patterns match before
      # the catch-all majors group (first match wins in Dependabot).
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
      # ESLint + plugins must upgrade together — ESLint 10 changed the
      # rule-context API; plugins that predate it fail at load time.
      eslint-core:
        patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "@types/eslint*"
        update-types:
          - major
      majors:
        update-types:
          - major
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      majors:
        update-types:
          - major
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

